<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">LatentLens와 J-lens가 읽는 서로 다른 관계</title>
<desc id="desc">같은 시각 hidden state를 보더라도 참조하는 공간과 출력 형식이 다르다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667777"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif} .title{font-weight:700} </style>
<rect width="1200" height="690" rx="16" fill="#fffefa"/>
<path d="M 40 42 H 1160" stroke="#16766b" stroke-width="4"/>
<text x="40" y="78" fill="#16766b" font-size="17" font-weight="700" text-anchor="start">FIGURE 03 · CONCEPT DIAGRAM</text>
<text x="40" y="126" fill="#173d39" font-size="32" font-weight="700" text-anchor="start">LatentLens와 J-lens가 읽는 서로 다른 관계</text>
<text x="40" y="164" fill="#667777" font-size="20" font-weight="400" text-anchor="start">같은 시각 hidden state를 보더라도 참조하는 공간과 출력 형식이 다르다.</text>
<rect x="40" y="325" width="225" height="140" rx="12" fill="#edf5f0" stroke="#cadbd3" stroke-width="1.5"/>
<text x="152.5" y="364" fill="#16766b" font-size="25" font-weight="700" text-anchor="middle">시각 표현 h</text>
<text x="152.5" y="402" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">레이어 l · 위치 t</text>
<path d="M 272 365 H 300 V 265 H 328" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<path d="M 272 425 H 300 V 495 H 328" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="335" y="205" width="320" height="150" rx="12" fill="#eaf2f9" stroke="#cadbd3" stroke-width="1.5"/>
<text x="495.0" y="244" fill="#316fa1" font-size="25" font-weight="700" text-anchor="middle">LatentLens</text>
<text x="495.0" y="282" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">문맥화된 텍스트 코퍼스</text>
<text x="495.0" y="312" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">cosine nearest neighbors</text>
<path d="M 665 280 L 745 280" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="755" y="205" width="400" height="150" rx="12" fill="#eaf2f9" stroke="#cadbd3" stroke-width="1.5"/>
<text x="955.0" y="244" fill="#316fa1" font-size="25" font-weight="700" text-anchor="middle">토큰 + 문장 문맥</text>
<text x="955.0" y="282" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">“이 표현은 무엇과 닮았나?”</text>
<rect x="335" y="430" width="320" height="150" rx="12" fill="#fff1df" stroke="#cadbd3" stroke-width="1.5"/>
<text x="495.0" y="469" fill="#b86d23" font-size="25" font-weight="700" text-anchor="middle">J-lens</text>
<text x="495.0" y="507" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">평균 Jacobian 변환</text>
<text x="495.0" y="537" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">final norm + 어휘 head</text>
<path d="M 665 505 L 745 505" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="755" y="430" width="400" height="150" rx="12" fill="#fff1df" stroke="#cadbd3" stroke-width="1.5"/>
<text x="955.0" y="469" fill="#b86d23" font-size="25" font-weight="700" text-anchor="middle">어휘 공간의 읽기</text>
<text x="955.0" y="507" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">“말로 이어지는 성분은?”</text>
<text x="600" y="628" fill="#16766b" font-size="23" font-weight="700" text-anchor="middle">둘의 일치·불일치는 후속 개입 실험의 후보가 된다.</text>
<text x="40" y="663" fill="#667777" font-size="17" font-weight="400" text-anchor="start">직접 작성한 개념도 · 실험 결과나 성능 순위를 나타내지 않음</text>
</svg>