<text x="190.0" y="287" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">선택한 입력에서</text>
<text x="190.0" y="317" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">실제 출력을 기록</text>
<path d="M 350 282 L 425 282" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
