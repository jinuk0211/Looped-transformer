<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">회로 그래프에서 원래 모델의 개입 검증까지</title>
<desc id="desc">단순화한 분석 흐름: 같은 입력에서 출력이 맞아도 개입 반응까지 같다는 뜻은 아니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667777"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif} .title{font-weight:700} </style>
<rect width="1200" height="700" rx="16" fill="#fffefa"/>
<path d="M 40 42 H 1160" stroke="#16766b" stroke-width="4"/>
<text x="40" y="78" fill="#16766b" font-size="17" font-weight="700" text-anchor="start">FIGURE 04 · CONCEPT DIAGRAM</text>
<text x="40" y="126" fill="#173d39" font-size="32" font-weight="700" text-anchor="start">회로 그래프에서 원래 모델의 개입 검증까지</text>
<text x="40" y="164" fill="#667777" font-size="20" font-weight="400" text-anchor="start">단순화한 분석 흐름: 같은 입력에서 출력이 맞아도 개입 반응까지 같다는 뜻은 아니다.</text>
<rect x="40" y="210" width="300" height="145" rx="12" fill="#edf5f0" stroke="#cadbd3" stroke-width="1.5"/>
