<text x="597.5" y="249" fill="#316fa1" font-size="25" font-weight="700" text-anchor="middle">Transcoder 근사</text>
<text x="597.5" y="287" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">설명된 특징의 기여</text>
<text x="597.5" y="317" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">+ 재구성 error</text>
<path d="M 770 282 L 845 282" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="855" y="210" width="305" height="145" rx="12" fill="#fff1df" stroke="#cadbd3" stroke-width="1.5"/>
<text x="1007.5" y="249" fill="#b86d23" font-size="25" font-weight="700" text-anchor="middle">Local replacement</text>
<text x="1007.5" y="287" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">attention 등 일부 고정</text>
<text x="1007.5" y="317" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">error로 기준점 보정</text>
<path d="M 1007 365 V 410 H 590 V 440" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="435" y="450" width="325" height="140" rx="12" fill="#eaf2f9" stroke="#cadbd3" stroke-width="1.5"/>
<text x="597.5" y="489" fill="#316fa1" font-size="25" font-weight="700" text-anchor="middle">Attribution graph</text>
<text x="597.5" y="527" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">경로와 가설을 추출</text>
<text x="597.5" y="557" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">pruning·근사 한계 기록</text>
<path d="M 425 520 L 350 520" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="40" y="450" width="300" height="140" rx="12" fill="#edf5f0" stroke="#cadbd3" stroke-width="1.5"/>
<text x="190.0" y="489" fill="#16766b" font-size="25" font-weight="700" text-anchor="middle">원래 모델에서 검증</text>
<text x="190.0" y="527" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">ablation · patching</text>
<text x="190.0" y="557" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">예측한 출력 변화 확인</text>
