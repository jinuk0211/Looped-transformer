<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">TraitBasis: 평가받는 에이전트가 아니라 상대를 조절</title>
<desc id="desc">사용자 시뮬레이터의 행동을 바꾸어 별도의 목표 에이전트를 시험한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667777"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif} .title{font-weight:700} </style>
<rect width="1200" height="650" rx="16" fill="#fffefa"/>
<path d="M 40 42 H 1160" stroke="#16766b" stroke-width="4"/>
<text x="40" y="78" fill="#16766b" font-size="17" font-weight="700" text-anchor="start">FIGURE 08 · CONCEPT DIAGRAM</text>
<text x="40" y="126" fill="#173d39" font-size="32" font-weight="700" text-anchor="start">TraitBasis: 평가받는 에이전트가 아니라 상대를 조절</text>
<text x="40" y="164" fill="#667777" font-size="20" font-weight="400" text-anchor="start">사용자 시뮬레이터의 행동을 바꾸어 별도의 목표 에이전트를 시험한다.</text>
<rect x="40" y="220" width="245" height="170" rx="12" fill="#edf5f0" stroke="#cadbd3" stroke-width="1.5"/>
<text x="162.5" y="259" fill="#16766b" font-size="25" font-weight="700" text-anchor="middle">성향 벡터</text>
<text x="162.5" y="297" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">impatience · confusion</text>
<text x="162.5" y="327" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">skepticism · incoherence</text>
<text x="162.5" y="357" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">강도와 조합 선택</text>
<path d="M 295 305 L 360 305" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="370" y="220" width="300" height="170" rx="12" fill="#fff1df" stroke="#cadbd3" stroke-width="1.5"/>
<text x="520.0" y="259" fill="#b86d23" font-size="25" font-weight="700" text-anchor="middle">사용자 시뮬레이터</text>
<text x="520.0" y="297" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">여기에 steering 적용</text>
<text x="520.0" y="327" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">성향이 드러나는 발화</text>
<path d="M 680 280 L 850 280" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<text x="765" y="258" fill="#667777" font-size="20" font-weight="400" text-anchor="middle">사용자 발화</text>
<path d="M 850 340 L 680 340" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<text x="765" y="375" fill="#667777" font-size="20" font-weight="400" text-anchor="middle">에이전트 응답</text>
<rect x="860" y="220" width="300" height="170" rx="12" fill="#eaf2f9" stroke="#cadbd3" stroke-width="1.5"/>
<text x="1010.0" y="259" fill="#316fa1" font-size="25" font-weight="700" text-anchor="middle">목표 에이전트</text>
<text x="1010.0" y="297" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">별도의 평가 대상</text>
<text x="1010.0" y="327" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">도구 사용·과제 수행</text>
<path d="M 1010 400 V 475 H 840" stroke="#667777" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<rect x="370" y="440" width="460" height="115" rx="12" fill="#edf5f0" stroke="#cadbd3" stroke-width="1.5"/>
<text x="600.0" y="479" fill="#16766b" font-size="25" font-weight="700" text-anchor="middle">평가</text>
<text x="600.0" y="517" fill="#173d39" font-size="20" font-weight="400" text-anchor="middle">과제 성공 · 성향 충실도 · 대화 안정성</text>
<text x="40" y="623" fill="#667777" font-size="17" font-weight="400" text-anchor="start">직접 작성한 개념도 · 실험 결과나 성능 순위를 나타내지 않음</text>
</svg>